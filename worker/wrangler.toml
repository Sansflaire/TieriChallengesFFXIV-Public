# Deploy with:  npx wrangler deploy      (run from the worker/ folder)
#
# One-time first: npx wrangler login  — opens a browser to authorise this machine.
#
# Secrets are DELIBERATELY not here. This file is committed, and a token in a committed
# file is the exact failure that put the old Discord webhook into every shipped DLL.
# Set them once, from the worker/ folder, and they live in Cloudflare only:
#
#   npx wrangler secret put DISCORD_WEBHOOK
#   npx wrangler secret put BAN_SALT
#
# BANS_URL is not secret, so it sits below as a plain var.

name = "challenges-relay"
main = "suggestions-worker.js"
compatibility_date = "2026-08-24"

[vars]
BANS_URL = "https://raw.githubusercontent.com/Sansflaire/TieriChallengesFFXIV-Sync/main/bans.json"

# Native Workers rate limiting. Chosen over KV because it needs no namespace, no extra auth, and
# is enforced by the platform rather than by logic a caller could race.
#
# BURST catches a script hammering the endpoint. SUSTAINED is the slower gate that a human
# clicking Send repeatedly will trip instead.
[[ratelimits]]
name = "RL_BURST"
namespace_id = "1001"
simple = { limit = 3, period = 10 }

[[ratelimits]]
name = "RL_SUSTAINED"
namespace_id = "1002"
simple = { limit = 8, period = 60 }
